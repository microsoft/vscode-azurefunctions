<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connector Trigger subscription picker fixture</title>
    <link rel="stylesheet" href="/dist/webview/connectorTriggerPicker.css">
    <style>
        :root {
            color-scheme: dark;
            --vscode-foreground: #cccccc;
            --vscode-descriptionForeground: #9d9d9d;
            --vscode-disabledForeground: #6d6d6d;
            --vscode-errorForeground: #f48771;
            --vscode-focusBorder: #007fd4;
            --vscode-font-family: "Segoe UI", sans-serif;
            --vscode-font-size: 13px;
            --vscode-input-background: #313131;
            --vscode-input-foreground: #cccccc;
            --vscode-input-border: #3c3c3c;
            --vscode-input-placeholderForeground: #989898;
            --vscode-button-background: #0e639c;
            --vscode-button-foreground: #ffffff;
            --vscode-button-hoverBackground: #1177bb;
            --vscode-dropdown-background: #313131;
            --vscode-dropdown-foreground: #f0f0f0;
            --vscode-dropdown-border: #3c3c3c;
            --vscode-list-activeSelectionBackground: #04395e;
            --vscode-list-activeSelectionForeground: #ffffff;
            --vscode-list-hoverBackground: #2a2d2e;
            --vscode-sideBar-background: #181818;
            --vscode-editor-background: #1f1f1f;
        }

        html, body, #root {
            min-height: 100%;
        }

        body {
            margin: 0;
            background: var(--vscode-editor-background);
            color: var(--vscode-foreground);
            font-family: var(--vscode-font-family);
        }
    </style>
</head>
<body class="vscode-dark">
    <div id="root"></div>
    <script type="module">
        const labels = {
            panelTitle: 'Template Gallery',
            galleryTitle: 'Template Gallery',
            gallerySubtitle: 'Create a new Azure Functions project from a template',
            browseTemplates: 'Browse Templates',
            connectorTriggers: 'Connector Triggers',
            buildWithCopilotChat: 'Build with Copilot Chat',
            connectorStep: 'Connector',
            eventStep: 'Event',
            azureContextRequired: 'Azure sign-in, a subscription, and a region are required before you can browse Connector Triggers.',
            subscription: 'Subscription',
            selectSubscription: 'Select a subscription',
            showAllSubscriptions: 'Show all subscriptions...',
            useFilteredSubscriptions: 'Use subscription filter...',
            region: 'Region',
            selectRegion: 'Select a region',
            loadingSubscriptions: 'Loading subscriptions...',
            loadingRegions: 'Loading regions...',
            recommendedRegions: 'Recommended',
            otherRegions: 'Other',
            liveCatalogSource: 'Browsing connectors available in the selected Azure subscription and region.',
            selectionUnavailable: 'The previous connector or event is no longer available in the live catalog. Choose another selection.',
            unavailable: 'Unavailable in the selected Azure catalog',
            connectorGroup: 'Connector',
            featuredConnectors: 'Featured connectors',
            otherConnectors: 'Other connectors ({0})',
            showOtherConnectors: 'Show other connectors',
            hideOtherConnectors: 'Hide other connectors',
            connectorPageTitle: 'Choose a connector',
            connectorPageDescription: 'Find the service that will start your function, then choose an event.',
            connectorSearchPlaceholder: 'Search connectors...',
            connectorCount: '{0} connectors',
            showMoreConnectors: 'Show more connectors',
            loadingConnectors: 'Loading connectors...',
            noConnectors: 'No connectors with trigger operations are available in this catalog.',
            eventPageTitle: 'Choose an event',
            eventPageDescription: 'Select the event that will start your function.',
            eventSearchPlaceholder: 'Search events...',
            loadingEvents: 'Loading events...',
            pollingEventDelivery: 'Polling',
            webhookEventDelivery: 'Webhook - creation is not supported yet',
            eventCount: 'Showing {0} of {1} events.',
            eventSelected: 'Selected: {0}',
            changeConnector: 'Change connector',
            noTriggers: 'No triggers are available for this connector.',
            useTemplate: 'Use Template',
            creatingProject: 'Creating project...',
            retry: 'Retry',
        };
        const subscriptions = Array.from({ length: 100 }, (_, index) => ({
            id: `00000000-0000-4000-8000-${String(index).padStart(12, '0')}`,
            label: index === 0
                ? 'A very long subscription display name that must never cover the adjacent Region control'
                : `Subscription ${String(index + 1).padStart(3, '0')}`,
        }));
        const filteredSubscriptions = subscriptions.slice(0, 50);
        const officeConnector = {
            id: 'office365',
            label: 'Office 365 Outlook',
        };
        const azureBlobConnector = {
            id: 'azureblob',
            label: 'Azure Blob Storage',
        };
        const adobeSignConnector = {
            id: 'adobesign',
            label: 'Adobe Acrobat Sign',
        };
        const creativeCloudConnector = {
            id: 'adobecreativecloud',
            label: 'Adobe Creative Cloud',
        };
        const kustoConnector = {
            id: 'kusto',
            label: 'Azure Data Explorer',
        };
        const githubConnector = {
            id: 'github',
            label: 'GitHub',
        };
        const officeOperations = [
            ['OnNewEmailV3', 'When a new email arrives'],
            ['OnFlaggedEmailV4', 'When an email is flagged'],
            ['OnNewMentionMeEmailV3', 'When an email mentions me'],
            ['CalendarGetOnNewItemsV3', 'When a calendar item is created'],
            ['OnUpcomingEventsV3', 'When an event is upcoming'],
            [
                'CalendarGetOnChangedItemsV3',
                'When an event is added, updated or deleted (V3)',
            ],
        ].map(([id, label]) => ({
            connectorId: officeConnector.id,
            id,
            isNotification: true,
            isWebhook: false,
            label,
        }));
        const operationMap = {
            office365: officeOperations,
            azureblob: [{
                connectorId: azureBlobConnector.id,
                id: 'OnUpdatedFiles_V2',
                isNotification: false,
                isWebhook: false,
                label: 'When a blob is added or modified (properties only) (V2)',
                description: 'This operation triggers a flow when blobs change.',
            }],
            github: [{
                connectorId: githubConnector.id,
                id: 'OnNewIssue',
                isNotification: false,
                isWebhook: false,
                label: 'When a new issue is created',
            }, {
                connectorId: githubConnector.id,
                id: 'SubscribePushWebhook',
                isNotification: false,
                isWebhook: true,
                label: 'When code is pushed',
            }],
            adobesign: [
                'When a new agreement is created',
                'When a web form agreement event occurs',
                'When an agreement is sent to a participant',
                'When an agreement workflow is completed successfully',
                'When an event occurs',
                'When the state of an agreement changes',
                'When a group event occurs',
            ].map((label, index) => ({
                connectorId: adobeSignConnector.id,
                id: `AdobeSignWebhook${index + 1}`,
                isNotification: false,
                isWebhook: true,
                label,
            })),
            adobecreativecloud: [
                'When an asset is added',
                'When an asset is updated',
            ].map((label, index) => ({
                connectorId: creativeCloudConnector.id,
                id: `CreativeCloudWebhook${index + 1}`,
                isNotification: false,
                isWebhook: true,
                label,
            })),
            kusto: [],
        };
        const eventSupportMap = {
            office365: 'poll',
            azureblob: 'poll',
            github: 'poll',
            adobesign: 'webhook-only',
            adobecreativecloud: 'webhook-only',
            kusto: 'none',
        };
        const catalogConnectors = [
            officeConnector,
            azureBlobConnector,
            adobeSignConnector,
            creativeCloudConnector,
            kustoConnector,
            githubConnector,
        ];
        const initialFeaturedConnectors = [
            officeConnector,
            { id: 'sharepointonline', label: 'SharePoint' },
            { id: 'onedriveforbusiness', label: 'OneDrive for Business' },
            { id: 'teams', label: 'Microsoft Teams' },
            { id: 'planner', label: 'Planner' },
            { id: 'salesforce', label: 'Salesforce' },
            { id: 'visualstudio-team-services', label: 'Azure DevOps' },
            { id: 'dataflows', label: 'Power Query Dataflows' },
        ];
        const initialOtherConnectors = [
            adobeSignConnector,
            creativeCloudConnector,
            azureBlobConnector,
            kustoConnector,
            githubConnector,
            ...Array.from({ length: 1670 }, (_, index) => ({
                id: `other-connector-${index + 1}`,
                label: `Other Connector ${String(index + 1).padStart(4, '0')}`,
            })),
        ];
        const initialCatalogConnectors = [
            ...initialFeaturedConnectors,
            ...initialOtherConnectors,
        ];
        const automation = new URLSearchParams(location.search).get('auto');
        const postResponse = data => window.dispatchEvent(new MessageEvent('message', { data }));
        const vscodeApi = {
            getState: () => undefined,
            setState: () => undefined,
            postMessage(message) {
                window.fixtureMessages.push(message);
                if (message.command === 'initialize' || message.command === 'loadFilteredSubscriptions') {
                    queueMicrotask(() => postResponse({
                        command: 'subscriptionsLoaded',
                        subscriptions: filteredSubscriptions,
                        showingAll: false,
                    }));
                } else if (message.command === 'loadAllSubscriptions') {
                    queueMicrotask(() => postResponse({
                        command: 'subscriptionsLoaded',
                        subscriptions,
                        showingAll: true,
                    }));
                } else if (message.command === 'selectSubscription') {
                    queueMicrotask(() => postResponse({
                        command: 'locationsLoaded',
                        subscriptionId: message.subscriptionId,
                        locations: [
                            {
                                name: 'westcentralus',
                                label: 'West Central US',
                                regionCategory: 'Other',
                            },
                            {
                                name: 'eastus2',
                                label: 'East US 2',
                                regionCategory: 'Recommended',
                            },
                        ],
                    }));
                } else if (message.command === 'selectRegion') {
                    queueMicrotask(() => {
                        postResponse({
                            command: 'azureContextSelected',
                            azureContext: {
                                subscriptionId: message.subscriptionId,
                                subscriptionName: filteredSubscriptions[0].label,
                                region: message.region,
                                regionDisplayName: 'West Central US',
                            },
                        });
                        postResponse({
                            command: 'catalogLoaded',
                            connectors: automation === 'selected-catalog'
                                ? initialCatalogConnectors
                                : catalogConnectors,
                            operations: [],
                        });
                    });
                } else if (message.command === 'loadConnectorOperations') {
                    queueMicrotask(() => postResponse({
                        command: 'connectorOperationsLoaded',
                        connectorId: message.connectorId,
                        eventSupport: eventSupportMap[message.connectorId] ?? 'none',
                        operations: operationMap[message.connectorId] ?? [],
                    }));
                } else if (message.command === 'continue') {
                    const operation = (operationMap[message.connectorId] ?? [])
                        .find(item => item.id === message.operationId);
                    queueMicrotask(() => postResponse(operation?.isWebhook ? {
                        command: 'projectCreationFailed',
                        message: 'Webhook Connector Triggers are not supported yet. Choose a polling event.',
                    } : {
                        command: 'projectCreationStarted',
                    }));
                }
            },
        };
        window.fixtureMessages = [];
        window.config = {
            _initialData: encodeURIComponent(JSON.stringify({
                language: 'TypeScript',
                labels,
            })),
        };
        const { render } = await import(
            `/dist/webview/connectorTriggerPicker.js?fixture=${Date.now()}`,
        );
        render('connectorTriggerPicker', vscodeApi);

        const waitFor = async predicate => {
                for (let index = 0; index < 120; index++) {
                    const value = predicate();
                    if (value) {
                        return value;
                    }
                    await new Promise(resolve => setTimeout(resolve, 25));
                }
                throw new Error(`Timed out while preparing fixture automation: ${automation}`);
        };
        if (automation === 'selected-catalog-capture') {
            await waitFor(() =>
                window.fixtureMessages.some(message =>
                    message.command === 'initialize'));
            postResponse({
                command: 'azureContextSelected',
                azureContext: {
                    subscriptionId: subscriptions[0].id,
                    subscriptionName: subscriptions[0].label,
                    region: 'westcentralus',
                    regionDisplayName: 'West Central US',
                },
            });
            postResponse({
                command: 'locationsLoaded',
                subscriptionId: subscriptions[0].id,
                locations: [
                    {
                        name: 'westcentralus',
                        label: 'West Central US',
                        regionCategory: 'Other',
                    },
                    {
                        name: 'eastus2',
                        label: 'East US 2',
                        regionCategory: 'Recommended',
                    },
                ],
            });
            postResponse({
                command: 'catalogLoaded',
                connectors: initialCatalogConnectors,
                operations: [],
            });
            await waitFor(() =>
                document.body.textContent.includes('1683 connectors') &&
                document.body.textContent.includes('Other connectors (1675)'));
        } else if (automation) {
            const directCatalogAutomation = [
                'events',
                'mixed',
                'nonfeatured',
                'no-triggers',
                'webhook',
                'webhook-keyboard',
            ].includes(automation);
            let input;
            if (directCatalogAutomation) {
                await waitFor(() =>
                    window.fixtureMessages.some(message =>
                        message.command === 'initialize'));
            } else {
                input = await waitFor(() => {
                    const element = document.querySelector('[role="combobox"]');
                    return element && !element.disabled ? element : undefined;
                });
                input.click();
                const firstOption = await waitFor(() =>
                    document.querySelector('[role="option"]'));
                firstOption.click();
                await waitFor(() =>
                    !document.querySelector('[role="listbox"]') &&
                    document.querySelector('select')?.options.length === 3);
            }

            if (automation === 'selected-catalog') {
                const region = await waitFor(() => {
                    const element = document.querySelector('select');
                    return element && !element.disabled ? element : undefined;
                });
                region.value = 'westcentralus';
                region.dispatchEvent(new Event('change', { bubbles: true }));
                await waitFor(() =>
                    document.body.textContent.includes('1683 connectors') &&
                    document.body.textContent.includes('Other connectors (1675)'));
            } else if (automation === 'open' || automation === 'all') {
                input.click();
                const options = await waitFor(() => {
                    const values = [...document.querySelectorAll('[role="option"]')];
                    return values.length === 51 ? values : undefined;
                });
                if (automation === 'all') {
                    options.at(-1).click();
                    await waitFor(() =>
                        !document.querySelector('[role="listbox"]') &&
                        window.fixtureMessages.some(message =>
                            message.command === 'loadAllSubscriptions'));
                    input.click();
                    await waitFor(() =>
                        document.querySelectorAll('[role="option"]').length === 101);
                }
            } else if (automation === 'events') {
                postResponse({
                    command: 'azureContextSelected',
                    azureContext: {
                        subscriptionId: subscriptions[0].id,
                        subscriptionName: subscriptions[0].label,
                        region: 'westcentralus',
                        regionDisplayName: 'West Central US',
                    },
                });
                postResponse({
                    command: 'catalogLoaded',
                    connectors: catalogConnectors,
                    operations: [],
                });
                const connectorButton = await waitFor(() =>
                    [...document.querySelectorAll('button')].find(button =>
                        button.textContent.includes(officeConnector.label)));
                connectorButton.click();
                await waitFor(() =>
                    document.body.textContent.includes('CalendarGetOnChangedItemsV3') ||
                    document.body.textContent.includes(
                        'When an event is added, updated or deleted (V3)',
                    ));
            } else if (automation === 'nonfeatured') {
                postResponse({
                    command: 'azureContextSelected',
                    azureContext: {
                        subscriptionId: subscriptions[0].id,
                        subscriptionName: subscriptions[0].label,
                        region: 'westcentralus',
                        regionDisplayName: 'West Central US',
                    },
                });
                postResponse({
                    command: 'catalogLoaded',
                    connectors: catalogConnectors,
                    operations: [],
                });
                const toggle = await waitFor(() =>
                    [...document.querySelectorAll('button')].find(button =>
                        button.textContent.includes('Other connectors')));
                toggle.click();
                const connectorButton = await waitFor(() =>
                    [...document.querySelectorAll('button')].find(button =>
                        button.textContent.includes(azureBlobConnector.label)));
                connectorButton.click();
                await waitFor(() =>
                    document.body.textContent.includes('OnUpdatedFiles_V2') ||
                    document.body.textContent.includes(
                        'When a blob is added or modified',
                    ));
            } else if (automation === 'mixed') {
                postResponse({
                    command: 'azureContextSelected',
                    azureContext: {
                        subscriptionId: subscriptions[0].id,
                        subscriptionName: subscriptions[0].label,
                        region: 'westcentralus',
                        regionDisplayName: 'West Central US',
                    },
                });
                postResponse({
                    command: 'catalogLoaded',
                    connectors: catalogConnectors,
                    operations: [],
                });
                const otherToggle = await waitFor(() =>
                    [...document.querySelectorAll('button')].find(button =>
                        button.textContent.includes('Other connectors')));
                otherToggle.click();
                const connectorButton = await waitFor(() =>
                    [...document.querySelectorAll('button')].find(button =>
                        button.textContent.includes(githubConnector.label)));
                connectorButton.click();
                await waitFor(() =>
                    document.body.textContent.includes('When a new issue is created') &&
                    document.body.textContent.includes('When code is pushed') &&
                    document.body.textContent.includes('Polling') &&
                    document.body.textContent.includes(
                        'Webhook - creation is not supported yet',
                    ));
            } else if (automation === 'webhook' ||
                automation === 'webhook-keyboard') {
                postResponse({
                    command: 'azureContextSelected',
                    azureContext: {
                        subscriptionId: subscriptions[0].id,
                        subscriptionName: subscriptions[0].label,
                        region: 'westcentralus',
                        regionDisplayName: 'West Central US',
                    },
                });
                postResponse({
                    command: 'catalogLoaded',
                    connectors: catalogConnectors,
                    operations: [],
                });
                const otherToggle = await waitFor(() =>
                    [...document.querySelectorAll('button')].find(button =>
                        button.textContent.includes('Other connectors')));
                otherToggle.click();
                const connectorButton = await waitFor(() =>
                    [...document.querySelectorAll('button')].find(button =>
                        button.textContent.includes(adobeSignConnector.label)));
                connectorButton.click();
                const webhookEvent = await waitFor(() =>
                    [...document.querySelectorAll('button')].find(button =>
                        button.textContent.includes(
                            'When a new agreement is created',
                        )));
                if (automation === 'webhook-keyboard') {
                    webhookEvent.focus();
                } else {
                    webhookEvent.click();
                    const useTemplate = await waitFor(() =>
                        [...document.querySelectorAll('button')].find(button =>
                            button.textContent.includes('Use Template')));
                    useTemplate.click();
                    await waitFor(() =>
                        document.querySelector('.project-creation-error')
                            ?.textContent.includes(
                                'Webhook Connector Triggers are not supported yet.',
                            ));
                }
            } else if (automation === 'no-triggers') {
                postResponse({
                    command: 'azureContextSelected',
                    azureContext: {
                        subscriptionId: subscriptions[0].id,
                        subscriptionName: subscriptions[0].label,
                        region: 'westcentralus',
                        regionDisplayName: 'West Central US',
                    },
                });
                postResponse({
                    command: 'catalogLoaded',
                    connectors: catalogConnectors,
                    operations: [],
                });
                const otherToggle = await waitFor(() =>
                    [...document.querySelectorAll('button')].find(button =>
                        button.textContent.includes('Other connectors')));
                otherToggle.click();
                const connectorButton = await waitFor(() =>
                    [...document.querySelectorAll('button')].find(button =>
                        button.textContent.includes(kustoConnector.label)));
                connectorButton.click();
                await waitFor(() =>
                    document.body.textContent.includes(
                        'No triggers are available for this connector.',
                    ));
            }
        }
    </script>
</body>
</html>
